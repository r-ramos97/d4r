# The d4r package for native Windows (scripts/package_windows.sh) from this commit's d4r DLLs and the ZLUDA and
# kernel artifacts of the last successful windows.yml run, then d4r\setup.ps1 on a Windows runner.
name: Windows package

on:
  push:
    branches: [windows-native]
  workflow_run:
    workflows: [Windows]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Package
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      packaged: ${{ steps.inputs.outputs.found }}
    steps:
      - uses: actions/checkout@v4
      - name: ZLUDA and kernels from the last successful Windows build
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow windows.yml --branch "$BRANCH" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::warning::no successful windows.yml run on $BRANCH yet; nothing to package"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n zluda-windows -D inputs/zluda
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n network-kernels -D inputs/kernels
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "ZLUDA and kernels from run $run_id"
      - name: Install MinGW-w64, clang-cl and Vulkan headers
        if: steps.inputs.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64-posix clang-tools-18 libvulkan-dev zip
      - name: Package
        if: steps.inputs.outputs.found == 'true'
        run: scripts/package_windows.sh dist
        env:
          D4R_WIN_ZLUDA: inputs/zluda
          D4R_WIN_KERNELS: inputs/kernels
          CLANG_CL: /usr/lib/llvm-18/bin/clang-cl
          MINGW_CXX: x86_64-w64-mingw32-g++-posix
      - uses: actions/upload-artifact@v4
        if: steps.inputs.outputs.found == 'true'
        with:
          name: d4r-windows
          path: dist/*.zip*
          if-no-files-found: error

  setup-script:
    name: d4r\setup.ps1 on Windows
    needs: package
    if: needs.package.outputs.packaged == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: d4r-windows
          path: package
      - name: A game folder with the package, OptiScaler.ini and nothing from NVIDIA
        shell: powershell
        run: |
          New-Item -ItemType Directory game | Out-Null
          Expand-Archive (Get-ChildItem package\*.zip).FullName -DestinationPath game
          Set-Content game\game.exe "not a game"
          Set-Content game\dxgi.dll "not OptiScaler"
          $ini = "[Upscalers]`r`nDx12Upscaler=auto`r`n[DLSS]`r`nEnabled=auto`r`n[Libraries]`r`nOptiDllPath=auto`r`n" +
                 "[Inputs]`r`nEnableDlssInputs=auto`r`n[Hooks]`r`nHookOriginalNvngxOnly=auto`r`n[NvApi]`r`n" +
                 "OverrideNvapiDll=auto`r`n[Spoofing]`r`nDxgi=auto`r`n[FrameGen]`r`nEnabled=auto`r`nFGInput=auto`r`n" +
                 "FGOutput=auto`r`n"
          [IO.File]::WriteAllText("$PWD\game\OptiScaler.ini", $ini)
      - name: Check only
        shell: powershell
        run: |
          $out = powershell -ExecutionPolicy Bypass -File game\d4r\setup.ps1 -GameFolder game -CheckOnly | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 1) { throw "expected exit code 1 (NVIDIA's files missing), got $LASTEXITCODE" }
          foreach ($line in "ok       d4r\nvngx.dll", "ok       d4r\zluda\zluda_nvcuda.dll", "ok       OptiScaler as dxgi.dll",
                            "MISSING  d4r\nvngx_dlss.dll", "MISSING  OptiScaler.ini needs") {
            if (-not $out.Contains($line)) { throw "missing in the output: $line" }
          }
          if ((Get-Content game\OptiScaler.ini -Raw).Contains("Dx12Upscaler=dlss")) { throw "-CheckOnly changed OptiScaler.ini" }
      - name: Set up
        shell: powershell
        run: |
          $out = powershell -ExecutionPolicy Bypass -File game\d4r\setup.ps1 -GameFolder game | Out-String
          Write-Host $out
          $ini = Get-Content game\OptiScaler.ini -Raw
          foreach ($line in "Dx12Upscaler=dlss`r`n", "OptiDllPath=d4r`r`n", "OverrideNvapiDll=false`r`n", "FGOutput=nofg`r`n") {
            if (-not $ini.Contains($line)) { throw "OptiScaler.ini lacks $line" }
          }
          if (-not (Test-Path game\OptiScaler.ini.d4r-backup)) { throw "no OptiScaler.ini backup" }
          if (-not $out.Contains("ok       OptiScaler.ini: set")) { throw "setup did not report the OptiScaler.ini change" }
