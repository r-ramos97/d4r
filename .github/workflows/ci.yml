# CPU-only checks: configuration and install-check tests, shell scripts, the two Windows-side components (the NGX
# shim and the Wine CUDA bridge) and the native Windows bridge, whose tests also run on a Windows runner. Native
# kernels need ROCm and are built by windows.yml.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and script checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configuration and install-check tests
        run: python3 -m unittest discover -s tests -v
      - name: ShellCheck (errors)
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck -S error scripts/*.sh kernels/build.sh kernels/tex/build_tex.sh packaging/d4r-check.sh
      - name: Python syntax
        run: python3 -m compileall -q kernels packaging scripts tests tools

  windows-components:
    name: Build the NGX shim and the CUDA bridges
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64, clang-cl, Vulkan headers and Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64-posix clang-tools-18 libvulkan-dev wine64-tools
      - name: NGX shim (build/d4r_nvngx.dll)
        run: bash scripts/build_d4r_nvngx_shim.sh
        env:
          CLANG_CL: /usr/lib/llvm-18/bin/clang-cl
          MINGW_CXX: x86_64-w64-mingw32-g++-posix
      - name: Wine CUDA bridge (build/wine-nvcuda)
        run: bash scripts/build_wine_nvcuda_bridge.sh
      - name: Native Windows CUDA bridge (build/windows/nvcuda.dll)
        run: bash scripts/build_windows_nvcuda.sh
      - name: D3D12 interop probe (build/windows/d4r-interop-probe.exe)
        run: bash scripts/build_d3d12_native_interop_probe.sh
        env:
          MINGW_CXX: x86_64-w64-mingw32-g++-posix
      - name: Native Windows tests under Wine
        run: python3 -m unittest tests.test_windows_native -v
        env:
          CLANG_CL: /usr/lib/llvm-18/bin/clang-cl
          MINGW_CXX: x86_64-w64-mingw32-g++-posix
      - name: Test programs for the Windows runner
        run: python3 tests/test_windows_native.py --build build/windows-tests
        env:
          CLANG_CL: /usr/lib/llvm-18/bin/clang-cl
          MINGW_CXX: x86_64-w64-mingw32-g++-posix
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tests
          path: build/windows-tests
          if-no-files-found: error

  windows-native-tests:
    name: Native Windows tests on Windows
    needs: windows-components
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-tests
          path: windows-tests
      - name: D3D12 debug layer (Windows' Graphics Tools), which the harness test turns on
        continue-on-error: true
        timeout-minutes: 15
        shell: powershell
        run: |
          Add-WindowsCapability -Online -Name "Tools.Graphics.DirectX~~~~0.0.1.0" | Out-String | Write-Host
          if (Test-Path "$env:WINDIR\System32\d3d12SDKLayers.dll") { Write-Host "d3d12SDKLayers.dll present" }
          else { Write-Host "::warning::the D3D12 debug layer is unavailable; the harness test runs without it" }
      - name: Bridge and shim against the mock ZLUDA, HIP and NGX core
        run: python -m unittest tests.test_windows_native -v
        env:
          D4R_TEST_PREBUILT: ${{ github.workspace }}\windows-tests
